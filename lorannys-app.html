// SCORING (calculado en el frontend con datos de Supabase)
// ══════════════════════════════════════════════════════════════════════════════
function calcScore(contact, allCommitments){
  const mine = allCommitments.filter(c=>c.contact_id===contact.id);
  const total = mine.length, done = mine.filter(c=>c.status==='completado').length;
  const daysSince = contact.last_interaction_at
    ? Math.floor((Date.now()-new Date(contact.last_interaction_at+'T00:00:00'))/86400000) : 180;
  const recencia = Math.max(0,1-daysSince/180);
  const frecuencia = Math.min(1,(contact.interactions_12m||0)/12);
  const influencia = contact.influence||0.5;
  const cumplimiento = total>0 ? done/total : 0.5;
  const total_score = .3*recencia+.25*frecuencia+.25*influencia+.2*cumplimiento;
  return { score:Math.round(total_score*100)/100, breakdown:{recencia,frecuencia,influencia,cumplimiento} };
}

function calcRisk(c){
  if(c.status==='completado') return {level:'bajo',overdue:false};
  if(c.due_date){
    const diff=Math.floor((new Date(c.due_date+'T00:00:00')-Date.now())/86400000);
    if(diff<0) return {level:'alto',overdue:true};
    if(diff<=3) return {level:'medio',overdue:false};
  }
  const days=Math.floor((Date.now()-new Date(c.created_at))/86400000);
  if(days>30) return {level:'alto',overdue:false};
  if(days>15) return {level:'medio',overdue:false};
  return {level:'bajo',overdue:false};
}

async function loadContacts(){
  const from=(S.contactsPage-1)*24, to=from+23;
  let q=sb.from('contacts')
    .select('*,company:companies(id,name)',{count:'exact'})
    .order('name')
    .range(from,to);
  if(S.contactsQ){ const n=norm(S.contactsQ); q=q.ilike('search_text',`%${n}%`); }
  if(S.contactsDept) q=q.ilike('departamento',`%${norm(S.contactsDept)}%`);
  if(S.contactsMun)  q=q.ilike('municipio',`%${norm(S.contactsMun)}%`);
  if(S.contactsCat)  q=q.ilike('categorias',`%${S.contactsCat}%`);
  const {data,count,error}=await q;
  if(error){toast(error.message,true);return;}
  S.contacts=data||[]; S.contactsTotal=count||0;
}
async function loadContactFilters(){
  const {data}=await sb.from('contacts').select('departamento,municipio,categorias').eq('user_id',S.user.id);
  const depts=new Set(), muns=new Set(), cats=new Set();
  (data||[]).forEach(c=>{
    if(c.departamento) depts.add(c.departamento);
    if(c.municipio) muns.add(c.municipio);
    if(c.categorias) c.categorias.split(',').forEach(x=>{ if(x.trim()) cats.add(x.trim()); });
  });
  S.contactFilters={depts:[...depts].sort(),muns:[...muns].sort(),cats:[...cats].sort()};
}
async function loadCompanies(){
  const from=(S.companiesPage-1)*24, to=from+23;
  let q=sb.from('companies').select('*,contacts!contacts_company_id_fkey(count),employees:company_employees(count)',{count:'exact'}).order('name').range(from,to);

  S.companies=data||[]; S.companiesTotal=count||0;

async function loadStats(){

  const {count:totalCompanies}=await sb.from('companies').select('*',{count:'exact',head:true});

function statusChip(status){
  const labels={pendiente:'Pendiente',en_proceso:'En proceso',bloqueado:'Bloqueado',escalado:'Escalado',completado:'Completado'};
  return `<span class="status-chip status-${status}">${labels[status]||status}</span>`;

function formatLocation(c){
  return [c.vereda?'Vereda '+c.vereda:null,c.corregimiento?'Corr. '+c.corregimiento:null,c.municipio,c.departamento].filter(Boolean).join(', ');
}
function categoriasChips(c){
  if(!c.categorias) return '';
  return c.categorias.split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip" style="font-size:11px;padding:3px 8px;">${escHtml(x)}</span>`).join(' ');
}
function renderPager(total,page,pageSize,prevAction,nextAction){
  if(total<=pageSize) return '';
  const totalPages=Math.ceil(total/pageSize);
  const from=Math.min((page-1)*pageSize+1,total), to=Math.min(page*pageSize,total);
  return `<div class="pager">
    <span class="pager-info">Mostrando ${from}–${to} de ${total}</span>
    <div class="flex items-center gap-2">
      <button class="btn-secondary" style="font-size:12px;padding:6px 12px;" data-action="${prevAction}" ${page<=1?'disabled':''}>← Anterior</button>
      <span style="font-size:12px;color:var(--gray-500);">Página ${page} / ${totalPages}</span>
      <button class="btn-secondary" style="font-size:12px;padding:6px 12px;" data-action="${nextAction}" ${page>=totalPages?'disabled':''}>Siguiente →</button>
    </div>
  </div>`;
}

  const risk=calcRisk(c);

  </div>`;
}

function renderMeetingResults(result,created){
  if(!result) return '';
  return `

      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="font-semibold text-sm" style="margin:0;">${result.sentences_analyzed} oraciones analizadas · ${result.commitments.length} compromiso(s) detectado(s)</h3>
          ${result.llm_escalation_needed?`<p class="text-xs text-gray-500 mt-1">⚠️ Algunos compromisos tienen baja confianza — revísalos antes de guardar</p>`:''}
        </div>
        ${!created?`<button class="btn-primary" id="create-btn">Guardar en el CRM</button>`:`<span style="color:#10b981;font-size:13px;font-weight:600;">✓ CRM actualizado</span>`}
      </div>
      ${result.commitments.map((c,i)=>`
        <div class="commitment-card ${c.requires_llm?'llm':''}" data-idx="${i}">
          <div class="flex items-start justify-between gap-3">
            <p class="text-sm text-gray-800" style="margin:0;flex:1;">${escHtml(c.text)}</p>
            <span class="confidence-badge ${c.confidence>=.8?'confidence-high':c.confidence>=.6?'confidence-mid':'confidence-low'}">${Math.round(c.confidence*100)}%</span>
          </div>
          <p class="text-xs text-gray-400 mt-1">Patrón: ${escHtml(c.matched_pattern)}</p>
          <div class="edit-grid" style="margin-top:8px;gap:8px;">
            <div><label>Responsable</label><input class="input-sm" data-field="responsible" value="${escHtml(c.responsible||'')}" /></div>
            <div><label>Fecha límite</label><input class="input-sm" type="date" data-field="due_date" value="${c.resolved_due_date||''}" /></div>
          </div>
        </div>`).join('')}
      ${result.entities.filter(e=>e.entity_type!=='persona').length?`
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-100);">

              <span class="chip" style="font-size:11px;">${escHtml(e.value)} <span style="opacity:.6;">${e.entity_type}</span></span>`).join('')}

        </div>`:''}</div>`;

function renderCalendar(){
  const {calYear:yr,calMonth:mo,calEvents:events}=S;
  const monthName=new Date(yr,mo,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  const byDay={};
  events.forEach(e=>{ const d=e.due_date?.slice(8,10); if(d){if(!byDay[d])byDay[d]=[];byDay[d].push(e);} });
  let cells='';
  for(let i=0;i<firstDay;i++) cells+=`<div class="cal-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const devs=byDay[String(d).padStart(2,'0')]||[];
    cells+=`<div class="cal-day${isToday?' today':''}">
      <div class="cal-day-num">${d}</div>
      ${devs.slice(0,3).map(e=>`<div class="cal-event ${calcRisk(e).level}" title="${escHtml(e.text)}">${escHtml(e.text)}</div>`).join('')}
      ${devs.length>3?`<div style="font-size:9px;color:var(--gray-400);">+${devs.length-3}</div>`:''}
    </div>`;
  }
  return `
    <h1 class="page-title">Calendario</h1>
    <p class="page-subtitle">Compromisos pendientes por fecha límite.</p>
    <div class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <button class="btn-secondary" data-action="cal-prev">← Anterior</button>
        <h3 class="font-semibold" style="text-transform:capitalize;">${monthName}</h3>
        <button class="btn-secondary" data-action="cal-next">Siguiente →</button>
      </div>
      <div class="cal-header-row">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <p class="text-xs text-gray-400 mt-3">${events.length} compromiso(s) con fecha límite este mes</p>
    </div>`;
}

function renderStats(){
  const s=S.statsData;
  if(!s) return '<div style="padding:40px;text-align:center;color:var(--gray-400);">Cargando estadísticas…</div>';
  const STATUS_L={pendiente:'Pendiente',en_proceso:'En proceso',bloqueado:'Bloqueado',escalado:'Escalado',completado:'Completado'};
  const maxMonth=Math.max(...(s.byMonth||[]).map(x=>x.count),1);
  return `
    <h1 class="page-title">Estadísticas</h1>
    <p class="page-subtitle">Inteligencia sobre los propios datos del despacho.</p>
    <div class="grid grid-3 mb-4">
      ${[{v:s.totalContacts,l:'Contactos'},{v:s.total,l:'Compromisos totales'},{v:s.rate+'%',l:'Tasa de cumplimiento'},{v:s.totalMeetings,l:'Reuniones analizadas'},{v:s.totalCompanies,l:'Empresas'}].map(x=>`
      <div class="card p-5 text-center"><p class="stat-big">${x.v}</p><p class="text-xs text-gray-500 mt-1">${x.l}</p></div>`).join('')}
    </div>
    <div class="grid grid-2">
      <div class="card p-5">
        <h3 class="font-semibold text-sm mb-3">Compromisos por estado</h3>
        ${['pendiente','en_proceso','bloqueado','escalado','completado'].map(k=>{
          const v=s.byStatus[k]||0, pct=s.total?Math.round(v/s.total*100):0;
          return `<div class="bar-row"><span class="bar-label">${STATUS_L[k]}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${v}</span></div>`;
        }).join('')}
      </div>
      <div class="card p-5">
        <h3 class="font-semibold text-sm mb-3">Compromisos por mes (últimos 12)</h3>
        ${s.byMonth.map(m=>{
          const pct=Math.round(m.count/maxMonth*100);
          return `<div class="bar-row"><span class="bar-label">${m.month}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${m.count}</span></div>`;
        }).join('')||'<p class="text-sm text-gray-400">Sin datos todavía.</p>'}
      </div>
    </div>`;
}

const NAV=[
  {id:'dashboard',label:'Command Center',ico:'dashboard'},
  {id:'agenda',label:'Agenda',ico:'calendar'},
  {id:'contacts',label:'Contactos',ico:'users'},
  {id:'companies',label:'Empresas',ico:'building'},
  {id:'meeting',label:'Reunión',ico:'mic'},
  {id:'meetings',label:'Historial',ico:'fileText'},
  {id:'commitments',label:'Compromisos',ico:'checklist'},
  {id:'calendar',label:'Calendario',ico:'calendar'},
  {id:'stats',label:'Estadísticas',ico:'barChart'},
];

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>`
    <button class="nav-item ${S.view===n.id?'active':''}" data-action="goto" data-view="${n.id}">
      ${icon(n.ico,16,'currentColor')} ${n.label}
    </button>`).join('');
}

async function render(){
  renderNav();
  const main=document.getElementById('main-content');
  if(S.view==='agenda') { main.innerHTML = await renderAgendaDia(); return; }
  if(S.view==='dashboard') main.innerHTML=renderDashboard();
  else if(S.view==='import') main.innerHTML=renderImport();
  else if(S.view==='contacts'&&!S.selectedContact) main.innerHTML=renderContactsList(), bindContactEvents();
  else if(S.view==='contacts'&&S.selectedContact) await renderContactDetail(S.selectedContact);
  else if(S.view==='companies'&&!S.selectedCompany) main.innerHTML=renderCompaniesList(), bindCompanyEvents();
  else if(S.view==='companies'&&S.selectedCompany) await renderCompanyDetail(S.selectedCompany);
  else if(S.view==='meeting') main.innerHTML=renderMeetingForm(), bindMeetingEvents();
  else if(S.view==='meetings'&&!S.selectedMeeting) main.innerHTML=renderMeetingsList();
  else if(S.view==='meetings'&&S.selectedMeeting) await renderMeetingDetail(S.selectedMeeting);
  else if(S.view==='commitments') main.innerHTML=renderCommitmentsList(), bindCommitmentsEvents();
  else if(S.view==='calendar') main.innerHTML=renderCalendar();
  else if(S.view==='stats') main.innerHTML=renderStats();
}

function bindContactEvents(){
  const qEl=document.getElementById('contacts-q');
  if(qEl) qEl.addEventListener('input',debounce(async e=>{S.contactsQ=e.target.value;S.contactsPage=1;await loadContacts();render();},350));
  ['f-dept','f-mun','f-cat'].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('change',async e=>{
      if(i===0) S.contactsDept=e.target.value;
      else if(i===1) S.contactsMun=e.target.value;
      else S.contactsCat=e.target.value;
      S.contactsPage=1; await loadContacts(); render();
    });
  });
}
function bindCompanyEvents(){
  const qEl=document.getElementById('companies-q');
  if(qEl) qEl.addEventListener('input',debounce(async e=>{S.companiesQ=e.target.value;S.companiesPage=1;await loadCompanies();render();},350));
}
function bindCommitmentsEvents(){
  const qEl=document.getElementById('commitments-q');
  if(qEl) qEl.addEventListener('input',debounce(async e=>{S.commitmentsQ=e.target.value;S.commitmentsPage=1;await loadCommitments();render();},350));
  const stEl=document.getElementById('commitments-status');
  if(stEl) stEl.addEventListener('change',async e=>{S.commitmentsStatus=e.target.value;S.commitmentsPage=1;await loadCommitments();render();});
}
function bindMeetingEvents(){
  document.getElementById('meeting-contact')?.addEventListener('change',e=>S.meeting.contactId=e.target.value||null);
  document.getElementById('meeting-date')?.addEventListener('change',e=>S.meeting.date=e.target.value);
  document.getElementById('meeting-text')?.addEventListener('input',e=>{S.meeting.text=e.target.value;S.meeting.result=null;S.meeting.created=false;});
  document.getElementById('analyze-btn')?.addEventListener('click',async()=>{
    const text=S.meeting.text;
    if(!text.trim()){toast('Pega una transcripción primero',true);return;}
    const {data:contacts}=await sb.from('contacts').select('id,name');
    try{
      const res=await fetch(RENDER_URL+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,meeting_date:S.meeting.date||null,known_contacts:contacts||[]})});
      S.meeting.result=await res.json();S.meeting.created=false;
      document.getElementById('meeting-results').innerHTML=renderMeetingResults(S.meeting.result,false);
      document.getElementById('create-btn')?.addEventListener('click',async()=>{
        const cards=document.querySelectorAll('[data-idx]');
        const commitments=[...cards].map(card=>{
          const idx=Number(card.dataset.idx);
          const orig=S.meeting.result.commitments[idx];
          return{text:orig.text,responsible:card.querySelector('[data-field="responsible"]').value||null,
            due_date:card.querySelector('[data-field="due_date"]').value||null,requires_llm:orig.requires_llm};
        });
        const {data:meeting,error:me}=await sb.from('meetings').insert({
          contact_id:S.meeting.contactId,transcript_text:text,meeting_date:S.meeting.date||null,
          sentences_analyzed:S.meeting.result.sentences_analyzed,llm_escalation_needed:S.meeting.result.llm_escalation_needed
        }).select().single();
        if(me){toast(me.message,true);return;}
        for(const c of commitments){
          await sb.from('commitments').insert({contact_id:S.meeting.contactId,meeting_id:meeting.id,...c,status:'pendiente',source:'rule_engine'});
        }
        if(S.meeting.contactId){
          const {data:ct}=await sb.from('contacts').select('interactions_12m,last_interaction_at').eq('id',S.meeting.contactId).single();
          await sb.from('contacts').update({interactions_12m:(ct?.interactions_12m||0)+1,last_interaction_at:S.meeting.date||new Date().toISOString().slice(0,10)}).eq('id',S.meeting.contactId);
        }
        S.meeting.created=true;
        document.getElementById('meeting-results').innerHTML=renderMeetingResults(S.meeting.result,true);
        await loadCommitments();
        toast('Reunión y compromisos guardados ✓');
      });
    }catch(err){toast('Error conectando con el Rule Engine: '+err.message,true);}
  });
}

function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}

// ══════════════════════════════════════════════════════════════════════════════
// MANEJADOR GLOBAL DE CLICKS
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const action=el.dataset.action;

  if(action==='goto'){
    S.view=el.dataset.view;S.selectedContact=null;S.selectedCompany=null;S.selectedMeeting=null;
    S.editingContactId=null;S.editingCompanyId=null;
    if(S.view==='dashboard'){await loadCommitments();await sb.from('contacts').select('*',{count:'exact',head:true}).then(({count})=>S.contactsTotal=count);}
    if(S.view==='contacts'){S.contactsQ='';S.contactsPage=1;await Promise.all([loadContacts(),loadContactFilters(),loadCompanies()]);}
    if(S.view==='companies'){S.companiesQ='';S.companiesPage=1;await loadCompanies();}
    if(S.view==='meeting'){await loadContacts();}
    if(S.view==='meetings') await loadMeetings();
    if(S.view==='commitments'){S.commitmentsQ='';S.commitmentsPage=1;await Promise.all([loadCommitments(),loadContacts()]);}
    if(S.view==='calendar') await loadCalendar(S.calYear,S.calMonth);
    if(S.view==='agenda'){ await loadAgendaDia(S.agendaFecha); await loadAgendaMes(); }
    if(S.view==='stats') await loadStats();
    render();
  }

  // Navegación
  else if(action==='select-contact'){ S.selectedContact=el.dataset.id;S.view='contacts';S.editingContactId=null;await render(); }
  else if(action==='back-to-contacts'){ S.selectedContact=null;S.editingContactId=null;await loadContacts();render(); }
  else if(action==='select-company'){ S.selectedCompany=el.dataset.id;S.view='companies';S.editingCompanyId=null;await render(); }
  else if(action==='back-to-companies'){ S.selectedCompany=null;S.editingCompanyId=null;await loadCompanies();render(); }
  else if(action==='select-meeting'){ S.selectedMeeting=el.dataset.id;S.view='meetings';render(); }
  else if(action==='back-to-meetings'){ S.selectedMeeting=null;render(); }

  // Contactos CRUD
  else if(action==='toggle-add-contact'){S.showAddContact=!S.showAddContact;if(S.showAddContact&&!S.companies.length)await loadCompanies();render();}
  else if(action==='cancel-add-contact'){S.showAddContact=false;render();}
  else if(action==='save-new-contact'){
    const name=document.getElementById('nc-name').value.trim();
    if(!name){toast('El nombre es obligatorio',true);return;}
    const payload={name,cargo:document.getElementById('nc-cargo').value.trim()||null,organizacion:document.getElementById('nc-org').value.trim()||null,
      influence:parseFloat(document.getElementById('nc-inf').value)||0.5,departamento:document.getElementById('nc-dept').value||null,
      municipio:document.getElementById('nc-mun').value.trim()||null,corregimiento:document.getElementById('nc-corr').value.trim()||null,
      vereda:document.getElementById('nc-vda').value.trim()||null,categorias:document.getElementById('nc-cats').value.trim()||null,
      company_id:document.getElementById('nc-company').value||null};
    const {error}=await sb.from('contacts').insert(payload);
    if(error){toast(error.message,true);return;}
    S.showAddContact=false;toast('Contacto creado ✓');
    await loadContacts();await loadContactFilters();render();
  }
  else if(action==='toggle-edit-contact'){
    S.editingContactId=S.editingContactId===el.dataset.id?null:el.dataset.id;
    if(S.editingContactId&&!S.companies.length)await loadCompanies();
    await renderContactDetail(S.selectedContact);
  }
  else if(action==='save-contact-edit'){
    const form=document.getElementById('edit-contact-form');
    const payload={};
    form.querySelectorAll('[data-field]').forEach(inp=>{
      const v=inp.value.trim();
      payload[inp.dataset.field]=v===''?null:(inp.type==='number'&&v?parseFloat(v):v||null);
    });
    if(!payload.name){toast('El nombre es obligatorio',true);return;}
    const {error}=await sb.from('contacts').update(payload).eq('id',el.dataset.id);
    if(error){toast(error.message,true);return;}
    S.editingContactId=null;toast('Contacto actualizado ✓');
    await loadContacts();await renderContactDetail(S.selectedContact);
  }
  else if(action==='delete-contact'){
    if(!confirm('¿Eliminar este contacto? Sus compromisos y reuniones se conservan.')) return;
    await sb.from('contacts').delete().eq('id',el.dataset.id);
    toast('Contacto eliminado');S.selectedContact=null;S.contactsPage=1;
    await loadContacts();render();
  }
  else if(action==='clear-contact-filters'){S.contactsDept='';S.contactsMun='';S.contactsCat='';S.contactsPage=1;await loadContacts();render();}

  // Relaciones
  else if(action==='toggle-add-rel'){S.showAddRelationship=!S.showAddRelationship;await renderContactDetail(S.selectedContact);}
  else if(action==='save-rel'){
    const relatedId=document.getElementById('rel-contact-id').value;
    if(!relatedId){toast('Selecciona un contacto',true);return;}
    const {error}=await sb.from('contact_relationships').insert({
      contact_id:el.dataset.contactId,related_contact_id:relatedId,
      relationship_type:document.getElementById('rel-type').value,
      notes:document.getElementById('rel-notes').value.trim()||null
    });
    if(error){toast(error.message,true);return;}
    S.showAddRelationship=false;toast('Relación guardada ✓');await renderContactDetail(S.selectedContact);
  }
  else if(action==='delete-rel'){
    await sb.from('contact_relationships').delete().eq('id',el.dataset.relId);
    toast('Relación eliminada');await renderContactDetail(S.selectedContact);
  }

  // Empresas CRUD
  else if(action==='toggle-add-company'){S.showAddCompany=!S.showAddCompany;render();}
  else if(action==='cancel-add-company'){S.showAddCompany=false;render();}
  else if(action==='save-new-company'){
    const name=document.getElementById('nco-name').value.trim();
    if(!name){toast('El nombre es obligatorio',true);return;}
    const emp=document.getElementById('nco-emp').value;
    const {error}=await sb.from('companies').insert({name,nit:document.getElementById('nco-nit').value.trim()||null,
      sector:document.getElementById('nco-sector').value||null,departamento:document.getElementById('nco-dept').value.trim()||null,
      municipio:document.getElementById('nco-mun').value.trim()||null,telefono:document.getElementById('nco-tel').value.trim()||null,
      email:document.getElementById('nco-email').value.trim()||null,sitio_web:document.getElementById('nco-web').value.trim()||null,
      direccion:document.getElementById('nco-dir').value.trim()||null,notas:document.getElementById('nco-notas').value.trim()||null,
      numero_empleados:emp?parseInt(emp):null});
    if(error){toast(error.message,true);return;}
    S.showAddCompany=false;toast('Empresa creada ✓');await loadCompanies();render();
  }
  else if(action==='toggle-edit-company'){
    S.editingCompanyId=S.editingCompanyId===el.dataset.id?null:el.dataset.id;
    await renderCompanyDetail(S.selectedCompany);
  }
  else if(action==='save-company-edit'){
    const form=document.getElementById('edit-company-form');
    const payload={};
    form.querySelectorAll('[data-field]').forEach(inp=>{
      const v=inp.value.trim();
      payload[inp.dataset.field]=v===''?null:(inp.type==='number'&&v?parseInt(v):v||null);
    });
    if(!payload.name){toast('El nombre es obligatorio',true);return;}
    const {error}=await sb.from('companies').update(payload).eq('id',el.dataset.id);
    if(error){toast(error.message,true);return;}
    S.editingCompanyId=null;toast('Empresa actualizada ✓');await loadCompanies();await renderCompanyDetail(S.selectedCompany);
  }
  else if(action==='delete-company'){
    if(!confirm('¿Eliminar esta empresa? Los contactos vinculados se conservan.')) return;
    await sb.from('company_employees').delete().eq('company_id',el.dataset.id);

// ── Notificaciones push del SO ────────────────────────────────────────────────
const PUSH = (() => {
  const seen = new Set();
  let _interval = null;
  async function _check(){
    if(!S.user||Notification.permission!=='granted') return;
    const {data}=await sb.from('commitments').select('*,contact:contacts(name)').neq('status','completado').not('due_date','is',null);
    const alerts=(data||[]).filter(c=>{const r=calcRisk(c);return r.overdue||r.level==='medio';});
    const overdue=alerts.filter(c=>calcRisk(c).overdue);
    const soon=alerts.filter(c=>!calcRisk(c).overdue);
    if(overdue.length){
      const tag='ov-'+overdue.map(x=>x.id).sort().join('').slice(0,40);
      if(!seen.has(tag)){seen.add(tag);new Notification(`🔴 ${overdue.length} compromiso(s) vencido(s) — LORANNYS`,{body:overdue.slice(0,3).map(x=>x.text.slice(0,60)).join('\n'),tag:'lorannys-ov'});}
    }
    if(soon.length){
      const tag='so-'+soon.map(x=>x.id).sort().join('').slice(0,40);
      if(!seen.has(tag)){seen.add(tag);new Notification(`⚠️ ${soon.length} compromiso(s) vencen pronto — LORANNYS`,{body:soon.slice(0,3).map(x=>x.text.slice(0,60)).join('\n'),tag:'lorannys-so'});}
    }
  }
  return {
    async init(){
      if(!('Notification' in window)) return false;
      if(Notification.permission==='denied') return false;
      const r=Notification.permission==='granted'||await Notification.requestPermission()==='granted';
      if(r){await _check();if(!_interval)_interval=setInterval(_check,5*60*1000);}
      return r;
    },
    forceCheck:_check
  };
})();

  await sb.from('contacts').select('*',{count:'exact',head:true}).then(({count})=>S.contactsTotal=count);

    const btn=document.createElement('button');
    btn.className='nav-item';btn.style.fontSize='12px';btn.style.color='rgba(255,255,255,.4)';
    btn.innerHTML=ok?`<span style="width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0;"></span>Alertas del SO activas`
      :`${icon('mail',14,'currentColor')} Activar notificaciones`;
    btn.addEventListener('click',async()=>{const r=await PUSH.init();if(r)PUSH.forceCheck();});
    container.appendChild(btn);
  });
}

// Detección automática de columnas por nombre
function autoDetectField(header) {
  const h = norm(String(header || ''));
  const patterns = {
    name:         ['nombre', 'name', 'nombres', 'nombre completo', 'full name', 'contacto', 'persona'],
    cargo:        ['cargo', 'puesto', 'posicion', 'rol', 'role', 'titulo', 'title', 'ocupacion', 'funcion'],
    organizacion: ['organizacion', 'empresa', 'entidad', 'institucion', 'organization', 'company', 'institucion', 'despacho'],
    departamento: ['departamento', 'dpto', 'dept', 'departament'],
    municipio:    ['municipio', 'ciudad', 'city', 'municipality', 'localidad', 'poblacion', 'mun'],
    corregimiento:['corregimiento', 'corr'],
    vereda:       ['vereda', 'vda', 'sector', 'barrio'],
    categorias:   ['categoria', 'categorias', 'tags', 'tipo', 'clasificacion', 'grupo', 'perfil', 'segmento'],
    influence:    ['influencia', 'influence', 'relevancia', 'importancia', 'peso', 'prioridad'],
    notes:        ['nota', 'notes', 'observacion', 'comentario', 'descripcion', 'observaciones', 'comments'],
  };
  for (const [field, aliases] of Object.entries(patterns)) {
    if (aliases.some(a => h.includes(a) || a.includes(h))) return field;
  }
  return '';
}

// Leer archivo Excel en el navegador con SheetJS
function parseExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]]; // primera hoja
        const rows = XLSX.utils.sheet_to_json(ws, {
          defval: '',       // valor por defecto para celdas vacías
          raw: false,       // todo como string
        });
        const headers = Object.keys(rows[0] || {});
        resolve({ rows, headers });
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// Convertir una fila del Excel a un objeto de contacto usando el mapeo
function rowToContact(row, mapping) {
  const contact = {};
  for (const [excelCol, sysField] of Object.entries(mapping)) {
    if (!sysField) continue;
    const raw = String(row[excelCol] || '').trim();
    if (!raw) continue;
    if (sysField === 'influence') {
      const num = parseFloat(raw.replace(',', '.'));
      if (!isNaN(num)) contact.influence = Math.min(1, Math.max(0, num));
    } else {
      // Si el campo ya tiene valor (caso de múltiples columnas mapeadas al mismo campo), concatena
      contact[sysField] = contact[sysField] ? contact[sysField] + ', ' + raw : raw;
    }
  }
  return contact;
}

                    ${IMPORT_FIELDS.map(f => `<option value="${f.key}" ${mapping[h]===f.key?'selected':''}>${f.label}</option>`).join('')}
                  </select>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-semibold text-sm" style="margin:0 0 12px 0;">Vista previa (primeras 4 filas)</h3>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr style="background:var(--gray-50);">
            ${Object.entries(mapping).filter(([,v])=>v).map(([col,field])=>`
              <th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--gray-500);">${IMPORT_FIELDS.find(f=>f.key===field)?.label||field}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${preview.map((row,i)=>`<tr style="${i%2?'background:var(--gray-50)':''}">
              ${Object.entries(mapping).filter(([,v])=>v).map(([col])=>`<td style="padding:8px 10px;color:var(--gray-700);">${escHtml(String(row[col]||'').slice(0,40))}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${!hasName ? `<div class="alert-critical mb-4"><div><p class="font-semibold text-sm" style="color:#be123c;margin:0;">Falta mapear el campo Nombre</p><p class="text-xs" style="color:#be123c;margin:2px 0 0 0;">Es el único campo obligatorio — selecciona qué columna contiene el nombre del contacto.</p></div></div>` : ''}

    <button class="btn-primary" data-action="start-import" ${!hasName?'disabled style="opacity:.5;cursor:not-allowed;"':''}>
      ${icon('checklist',16,'#fff')} Importar ${rows.length.toLocaleString('es-CO')} contactos →
    </button>`;
}

function renderImportProgress() {
  const { done, total, errors } = S.importProgress;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  return `
    <h1 class="page-title">Importando contactos…</h1>
    <p class="page-subtitle">No cierres esta ventana hasta que termine.</p>
    <div class="card p-5" style="max-width:480px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span class="text-sm font-semibold text-gray-700">${done.toLocaleString('es-CO')} / ${total.toLocaleString('es-CO')} contactos</span>
        <span class="text-sm font-bold text-violet">${pct}%</span>
      </div>
      <div style="background:var(--gray-100);border-radius:999px;height:12px;overflow:hidden;">
        <div style="height:100%;border-radius:999px;background:var(--brand-gradient);width:${pct}%;transition:width .3s;"></div>
      </div>
      ${errors.length > 0 ? `<p class="text-xs text-gray-400" style="margin-top:10px;">⚠ ${errors.length} fila(s) con errores omitidas</p>` : ''}
    </div>`;
}

function renderImportDone() {
  const { done, total, errors } = S.importProgress;
  return `
    <div class="card p-5" style="max-width:480px;text-align:center;">
      <div style="font-size:52px;margin-bottom:16px;">✅</div>
      <h2 class="page-title" style="margin-bottom:8px;">¡Importación completada!</h2>
      <p class="text-sm text-gray-500" style="margin-bottom:20px;">
        <strong style="color:var(--intelligence-violet);font-size:18px;">${done.toLocaleString('es-CO')}</strong> contactos importados exitosamente.
        ${errors.length > 0 ? `<br><span style="color:#b45309;">⚠ ${errors.length} filas omitidas por error (nombre vacío).</span>` : ''}
      </p>
      <button class="btn-primary" data-action="finish-import" style="margin:0 auto;">
        Ver contactos →
      </button>
      ${errors.length > 0 ? `
      <details style="margin-top:16px;text-align:left;">
        <summary class="text-xs text-gray-400" style="cursor:pointer;">Ver filas con error (${errors.length})</summary>
        <div style="margin-top:8px;background:var(--gray-50);border-radius:10px;padding:10px;max-height:160px;overflow-y:auto;">
          ${errors.map((e,i)=>`<p class="text-xs text-gray-500" style="margin:2px 0;">Fila ${e.row}: ${escHtml(e.reason)}</p>`).join('')}
        </div>
      </details>` : ''}
    </div>`;
}

// ── Lógica de importación ─────────────────────────────────────────────────────
async function processExcelFile(file) {
  const errEl = document.getElementById('import-file-error');
  if (!file) return;
  if (!file.name.match(/\.(xlsx|xls)$/i)) {
    if (errEl) { errEl.textContent = 'Solo se aceptan archivos .xlsx o .xls'; errEl.style.display = 'block'; }
    return;
  }
  try {
    document.getElementById('drop-zone').innerHTML = '<div style="font-size:32px;">⏳</div><p class="text-sm text-gray-500 mt-3">Leyendo archivo…</p>';
    const { rows, headers } = await parseExcel(file);
    if (!rows.length) { toast('El archivo está vacío o no tiene datos', true); return; }
    S.importRawRows = rows;
    S.importHeaders = headers;
    // Auto-detectar mapeo
    S.importMapping = {};
    headers.forEach(h => { S.importMapping[h] = autoDetectField(h); });
    S.importStep = 'map';
    render();
  } catch(err) {
    toast('Error al leer el archivo: ' + err.message, true);
    S.importStep = 'upload';
    render();
  }
}

async function runImport() {
  const rows = S.importRawRows;
  const mapping = S.importMapping;
  const BATCH = 100;
  S.importStep = 'progress';
  S.importProgress = { done: 0, total: rows.length, errors: [] };
  render();

  const contacts = [];
  rows.forEach((row, idx) => {
    const contact = rowToContact(row, mapping);
    if (!contact.name || !contact.name.trim()) {
      S.importProgress.errors.push({ row: idx + 2, reason: 'Nombre vacío' });
      return;
    }
    contacts.push(contact);
  });

  S.importProgress.total = contacts.length;

  for (let i = 0; i < contacts.length; i += BATCH) {
    const batch = contacts.slice(i, i + BATCH);
    const { error } = await sb.from('contacts').insert(batch);
    if (error) {
      // Si falla el lote completo, intentar uno por uno
      for (const c of batch) {
        const { error: e2 } = await sb.from('contacts').insert(c);
        if (!e2) S.importProgress.done++;
        else S.importProgress.errors.push({ row: '?', reason: e2.message.slice(0, 60) });
      }
    } else {
      S.importProgress.done += batch.length;
    }
    // Actualizar UI cada lote
    const progressDiv = document.querySelector('.card .bar-fill, [style*="width:"]');
    const pct = Math.round(S.importProgress.done / contacts.length * 100);
    document.querySelector('[style*="width:"][style*="transition"]')?.setAttribute('style',
      `height:100%;border-radius:999px;background:var(--brand-gradient);width:${pct}%;transition:width .3s;`);
    // Re-render cada 500 contactos para mostrar progreso real
    if (i % 500 === 0 && i > 0) render();
  }

  S.importStep = 'done';
  render();
}

// ── Manejadores de eventos de importación ────────────────────────────────────
document.addEventListener('change', e => {
  if (e.target.id === 'excel-file-input') {
    processExcelFile(e.target.files[0]);
  }
  // Cambiar mapeo de columna en tiempo real
  if (e.target.dataset.action === 'set-mapping') {
    S.importMapping[e.target.dataset.col] = e.target.value;
    // Solo re-render la preview, sin rehacer toda la vista
    const preview = document.querySelector('.card:last-child table');
    // Re-render completo para actualizar la preview
    document.getElementById('main-content').innerHTML = renderImport();
  }
});

function handleExcelDrop(event) {
  event.preventDefault();
  const file = event.dataTransfer?.files?.[0];
  if (file) processExcelFile(file);
}

// ── Click handler para importación ───────────────────────────────────────────
// (se conecta al handler global existente)
const _origClickHandler = document.onclick;
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'open-import') {
    S.view = 'import'; S.importStep = 'upload';
    S.importRawRows = []; S.importHeaders = []; S.importMapping = {};
    render();
  }
  else if (action === 'cancel-import' || action === 'import-back-to-upload') {
    if (action === 'import-back-to-upload') {
      S.importStep = 'upload'; render();
    } else {
      S.view = 'contacts'; S.selectedContact = null;
      await loadContacts(); render();
    }
  }
  else if (action === 'start-import') {
    const hasName = Object.values(S.importMapping).includes('name');
    if (!hasName) { toast('Debes mapear al menos la columna de Nombre', true); return; }
    await runImport();
  }
  else if (action === 'finish-import') {
    S.view = 'contacts'; S.contactsPage = 1; S.importStep = null;
    toast('Base de datos actualizada ✓');
    await sb.from('contacts').select('*', { count: 'exact', head: true }).then(({ count }) => S.contactsTotal = count);
    await loadContacts(); await loadContactFilters(); render();
  }
}, true); // capture: true para procesar antes del handler principal

// Escuchar cambios de mapping via delegación
document.addEventListener('change', async e => {
  if (e.target.dataset?.action === 'set-mapping') {
    S.importMapping[e.target.dataset.col] = e.target.value;
    // Re-render solo la preview dentro de la vista
    if (S.importStep === 'map') {
      document.getElementById('main-content').innerHTML = renderImport();
    }
  }
}, true);

// Escuchar input de archivo
document.addEventListener('change', e => {
  if (e.target.id === 'excel-file-input') processExcelFile(e.target.files[0]);
}, true);
sb.auth.onAuthStateChange((event,session)=>{
  if(session?.user){S.user=session.user;if(document.getElementById('app'))return;initApp();}
  else renderLogin();
});

// Verificar sesión existente al cargar
sb.auth.getSession().then(({data:{session}})=>{
  if(session?.user){S.user=session.user;initApp();}
  else renderLogin();
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// MÓDULO AGENDA EJECUTIVA
// ══════════════════════════════════════════════════════════════════════════════

const ESTADO_AG = {
  confirmado:   { label:'Confirmado',     css:'estado-confirmado' },
  pendiente:    { label:'Pendiente',      css:'estado-pendiente' },
  por_confirmar:{ label:'Por confirmar',  css:'estado-por_confirmar' },
  cancelado:    { label:'Cancelado',      css:'estado-cancelado' },
  realizado:    { label:'Realizado',      css:'estado-realizado' },
};

function fechaLarga(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
}

function isoHoy(){ return new Date().toISOString().slice(0,10); }

// ── Carga de datos ────────────────────────────────────────────────────────────
async function loadAgendaDia(fecha){
  const [{ data: eventos }, { data: objetivos }] = await Promise.all([
    sb.from('agenda_eventos').select('*,contact:contacts(id,name)').eq('fecha',fecha).order('hora'),
    sb.from('agenda_objetivos').select('*').eq('fecha',fecha).order('orden'),
  ]);
  S.agendaFecha = fecha;
  S.agendaEventos = eventos || [];
  S.agendaObjetivos = objetivos || [];
}

async function loadAgendaMes(){
  const { year, month } = S.agendaMes;
  const inicio = `${year}-${String(month+1).padStart(2,'0')}-01`;
  const fin = new Date(year, month+1, 0).toISOString().slice(0,10);
  const { data } = await sb.from('agenda_eventos').select('fecha').gte('fecha',inicio).lte('fecha',fin);
  const dias = {};
  (data||[]).forEach(e=>{ dias[e.fecha] = (dias[e.fecha]||0)+1; });
  S.agendaMes.dias = dias;
}

// ── Vista principal — MES + DÍA ───────────────────────────────────────────────
async function renderAgendaDia(){
  const fecha = S.agendaFecha;
  const eventos = S.agendaEventos;
  const objetivos = S.agendaObjetivos;
  const hoy = isoHoy();
  const { year, month, dias } = S.agendaMes;
  const monthName = new Date(year,month,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();

  // Calendado mes (mini)
  let celdas = '';
  for(let i=0;i<firstDay;i++) celdas+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cnt=dias[ds]||0;
    const isHoy=ds===hoy, isSel=ds===fecha;
    celdas+=`<div class="mes-dia${isHoy?' hoy':''}${cnt?' con-eventos':''}" data-action="agenda-goto-dia" data-fecha="${ds}"
      style="${isSel?'border-color:var(--rose);background:#fdf4ff;border-width:2px;':''}">
      <div class="mes-dia-num" style="${isHoy?'color:var(--intelligence-violet);':''}">${d}</div>
      ${cnt?`<div class="mes-dia-count">${cnt} ev.</div>`:''}
    </div>`;
  }

  // Tabla de eventos
  const tablaEventos = eventos.length === 0
    ? `<div style="text-align:center;padding:40px;color:var(--gray-400);">
        <div style="font-size:32px;margin-bottom:8px;">📅</div>
        <p class="text-sm">Sin eventos para este día.</p>
        <button class="btn-primary mt-3" data-action="toggle-add-evento" style="margin:12px auto 0;">+ Agregar primer evento</button>
       </div>`
    : `<div style="overflow-x:auto;">
        <table class="timeline-table">
          <thead><tr>
            <th style="width:90px;">Hora</th>
            <th>Compromiso</th>
            <th>Lugar</th>
            <th>Responsable(s)</th>
            <th>Estado</th>
            <th style="width:60px;"></th>
          </tr></thead>
          <tbody>
            ${eventos.map(e=>`<tr>
              <td class="timeline-hora">${escHtml(e.hora)}${e.hora_fin?'<br><span style="font-size:11px;font-weight:400;color:var(--gray-400);">'+escHtml(e.hora_fin)+'</span>':''}</td>
              <td>
                <div class="timeline-compromiso">${escHtml(e.compromiso)}</div>
                ${e.contact?`<div style="font-size:11px;color:var(--intelligence-violet);margin-top:2px;">👤 ${escHtml(e.contact.name)}</div>`:''}
                ${e.notas?`<div style="font-size:11px;color:var(--gray-400);margin-top:2px;">${escHtml(e.notas)}</div>`:''}
              </td>
              <td><div class="timeline-lugar">${escHtml(e.lugar||'—')}</div></td>
              <td><div style="font-size:12px;color:var(--gray-700);">${escHtml(e.responsables||'—')}</div></td>
              <td><span class="estado-chip-ag ${ESTADO_AG[e.estado]?.css||''}">${ESTADO_AG[e.estado]?.label||e.estado}</span></td>
              <td class="flex gap-1">
                <button class="icon-btn" data-action="edit-evento" data-id="${e.id}" title="Editar">${icon('edit',14)}</button>
                <button class="icon-btn" data-action="delete-evento" data-id="${e.id}" title="Eliminar">${icon('x',14)}</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

  return `
    <div class="flex items-center gap-3 mb-4" style="flex-wrap:wrap;">
      <h1 class="page-title" style="margin:0;flex:1;">Agenda Ejecutiva</h1>
      <button class="export-btn" data-action="export-agenda-pdf" data-fecha="${fecha}">${icon('download',13)} Exportar PDF</button>
    </div>

    <div class="grid" style="grid-template-columns:280px 1fr;gap:20px;align-items:start;">

      <!-- Mini calendario mes -->
      <div class="card p-5" style="position:sticky;top:24px;">
        <div class="flex items-center justify-between mb-3">
          <button class="agenda-nav-btn" style="background:var(--gray-50);border:1px solid var(--gray-200);color:var(--gray-700);" data-action="agenda-mes-prev">←</button>
          <span class="text-sm font-semibold" style="text-transform:capitalize;">${monthName}</span>
          <button class="agenda-nav-btn" style="background:var(--gray-50);border:1px solid var(--gray-200);color:var(--gray-700);" data-action="agenda-mes-next">→</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;">
          ${['D','L','M','M','J','V','S'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--gray-400);padding:2px;">${d}</div>`).join('')}
        </div>
        <div class="mes-grid">${celdas}</div>
        <div class="flex gap-2 mt-3">
          <button class="btn-secondary w-full" style="font-size:12px;justify-content:center;" data-action="agenda-goto-dia" data-fecha="${hoy}">Hoy</button>
        </div>
      </div>

      <!-- Vista del día -->
      <div>
        <div class="agenda-header">
          <div class="agenda-fecha-nav">
            <button class="agenda-nav-btn" data-action="agenda-dia-prev">← Día anterior</button>
            <h2>${fechaLarga(fecha)}</h2>
            <button class="agenda-nav-btn" data-action="agenda-dia-next">Día siguiente →</button>
          </div>

          <!-- Objetivos del día -->
          <div class="agenda-obj">
            <div class="flex items-center justify-between mb-2">
              <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.8;">Objetivos del día</span>
              <button style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;" data-action="toggle-add-objetivo">+ Agregar</button>
            </div>
            ${S.showAddObjetivo?`
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input class="input-sm" id="new-objetivo-input" placeholder="Escribir objetivo del día…" style="flex:1;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff;" />
              <button style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;" data-action="save-objetivo">Guardar</button>
            </div>`:''}
            ${objetivos.length===0 && !S.showAddObjetivo
              ? `<p style="font-size:12px;opacity:.6;margin:0;">Sin objetivos definidos para este día.</p>`
              : objetivos.map(o=>`
                <div class="agenda-obj-item">
                  <span style="flex:1;">${escHtml(o.texto)}</span>
                  <button style="background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:0;font-size:12px;" data-action="delete-objetivo" data-id="${o.id}">✕</button>
                </div>`).join('')}
          </div>
        </div>

        <!-- Formulario agregar evento -->
        ${S.showAddEvento || S.editingEventoId ? renderFormEvento(S.editingEventoId ? eventos.find(e=>e.id===S.editingEventoId) : null) : ''}

        <!-- Botón agregar + tabla -->
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold" style="margin:0;">Línea de tiempo</h3>
          ${!S.showAddEvento&&!S.editingEventoId?`<button class="btn-secondary" data-action="toggle-add-evento">${icon('plus',14)} Agregar evento</button>`:''}
        </div>
        <div class="card">${tablaEventos}</div>
      </div>

    </div>`;
}

// ── Formulario evento ─────────────────────────────────────────────────────────
function renderFormEvento(ev){
  const isEdit = !!ev;
  const v = ev || {};
  return `
    <div class="card p-5 mb-4">
      <h3 class="font-semibold text-sm" style="margin:0 0 14px 0;">${isEdit?'Editar evento':'Nuevo evento'}</h3>
      <div class="edit-grid">
        <div><label>Hora inicio *</label><input class="input-sm" id="ev-hora" placeholder="Ej. 9:00 AM" value="${escHtml(v.hora||'')}" /></div>
        <div><label>Hora fin (opcional)</label><input class="input-sm" id="ev-hora-fin" placeholder="Ej. 10:00 AM" value="${escHtml(v.hora_fin||'')}" /></div>
        <div style="grid-column:1/-1;"><label>Compromiso / Nombre del evento *</label><input class="input-sm" id="ev-compromiso" placeholder="Ej. Reunión con Asomicrofinanzas" value="${escHtml(v.compromiso||'')}" /></div>
        <div><label>Lugar</label><input class="input-sm" id="ev-lugar" placeholder="Ej. Restaurante La Cesta, CLL 81 con CRA 9 — o 'Reunión virtual'" value="${escHtml(v.lugar||'')}" /></div>
        <div><label>Estado</label>
          <select class="input-sm" id="ev-estado">
            ${Object.entries(ESTADO_AG).map(([k,s])=>`<option value="${k}" ${(v.estado||'confirmado')===k?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div style="grid-column:1/-1;"><label>Responsable(s) — separados por coma</label><input class="input-sm" id="ev-resp" placeholder="Ej. Lorannys Lucas, Ana Blanco" value="${escHtml(v.responsables||'')}" /></div>
        <div style="grid-column:1/-1;"><label>Contacto del CRM (opcional)</label>
          <select class="input-sm" id="ev-contact">
            <option value="">— Sin asociar —</option>
            ${S.contacts.map(c=>`<option value="${c.id}" ${v.contact_id===c.id?'selected':''}>${escHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div style="grid-column:1/-1;"><label>Notas adicionales</label><input class="input-sm" id="ev-notas" placeholder="Observaciones internas" value="${escHtml(v.notas||'')}" /></div>
      </div>
      <div class="edit-actions">
        <button class="btn-primary" data-action="${isEdit?'save-edit-evento':'save-new-evento'}" ${isEdit?`data-id="${ev.id}"`:''}>${isEdit?'Guardar cambios':'Agregar evento'}</button>
        <button class="btn-secondary" data-action="cancel-form-evento">Cancelar</button>
      </div>
    </div>`;
}

// ── Click handler del módulo agenda ──────────────────────────────────────────
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'agenda-goto-dia') {
    S.agendaFecha = el.dataset.fecha;
    S.showAddEvento = false; S.editingEventoId = null; S.showAddObjetivo = false;
    if(!S.contacts.length) await loadContacts();
    await loadAgendaDia(S.agendaFecha);
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'agenda-dia-prev' || action === 'agenda-dia-next') {
    const d = new Date(S.agendaFecha + 'T00:00:00');
    d.setDate(d.getDate() + (action === 'agenda-dia-prev' ? -1 : 1));
    S.agendaFecha = d.toISOString().slice(0,10);
    S.showAddEvento = false; S.editingEventoId = null; S.showAddObjetivo = false;
    await loadAgendaDia(S.agendaFecha);
    await loadAgendaMes();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'agenda-mes-prev' || action === 'agenda-mes-next') {
    let { year, month } = S.agendaMes;
    month += action === 'agenda-mes-prev' ? -1 : 1;
    if (month < 0) { month = 11; year--; }
    if (month > 11) { month = 0; year++; }
    S.agendaMes = { ...S.agendaMes, year, month };
    await loadAgendaMes();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'toggle-add-evento') {
    S.showAddEvento = !S.showAddEvento; S.editingEventoId = null;
    if(!S.contacts.length) await loadContacts();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'cancel-form-evento') {
    S.showAddEvento = false; S.editingEventoId = null;
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'save-new-evento') {
    const hora = document.getElementById('ev-hora').value.trim();
    const compromiso = document.getElementById('ev-compromiso').value.trim();
    if (!hora || !compromiso) { toast('Hora y compromiso son obligatorios', true); return; }
    const { error } = await sb.from('agenda_eventos').insert({
      fecha: S.agendaFecha, hora, hora_fin: document.getElementById('ev-hora-fin').value.trim()||null,
      compromiso, lugar: document.getElementById('ev-lugar').value.trim()||null,
      estado: document.getElementById('ev-estado').value,
      responsables: document.getElementById('ev-resp').value.trim()||null,
      contact_id: document.getElementById('ev-contact').value||null,
      notas: document.getElementById('ev-notas').value.trim()||null,
    });
    if (error) { toast(error.message, true); return; }
    S.showAddEvento = false; toast('Evento agregado ✓');
    await loadAgendaDia(S.agendaFecha); await loadAgendaMes();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'edit-evento') {
    S.editingEventoId = el.dataset.id; S.showAddEvento = false;
    if(!S.contacts.length) await loadContacts();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'save-edit-evento') {
    const hora = document.getElementById('ev-hora').value.trim();
    const compromiso = document.getElementById('ev-compromiso').value.trim();
    if (!hora || !compromiso) { toast('Hora y compromiso son obligatorios', true); return; }
    const { error } = await sb.from('agenda_eventos').update({
      hora, hora_fin: document.getElementById('ev-hora-fin').value.trim()||null,
      compromiso, lugar: document.getElementById('ev-lugar').value.trim()||null,
      estado: document.getElementById('ev-estado').value,
      responsables: document.getElementById('ev-resp').value.trim()||null,
      contact_id: document.getElementById('ev-contact').value||null,
      notas: document.getElementById('ev-notas').value.trim()||null,
    }).eq('id', el.dataset.id);
    if (error) { toast(error.message, true); return; }
    S.editingEventoId = null; toast('Evento actualizado ✓');
    await loadAgendaDia(S.agendaFecha);
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'delete-evento') {
    if (!confirm('¿Eliminar este evento?')) return;
    await sb.from('agenda_eventos').delete().eq('id', el.dataset.id);
    toast('Evento eliminado');
    await loadAgendaDia(S.agendaFecha); await loadAgendaMes();
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'toggle-add-objetivo') {
    S.showAddObjetivo = !S.showAddObjetivo;
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
    if (S.showAddObjetivo) setTimeout(() => document.getElementById('new-objetivo-input')?.focus(), 50);
  }

  else if (action === 'save-objetivo') {
    const texto = document.getElementById('new-objetivo-input')?.value.trim();
    if (!texto) { toast('Escribe el objetivo', true); return; }
    const maxOrden = Math.max(0, ...S.agendaObjetivos.map(o => o.orden));
    const { error } = await sb.from('agenda_objetivos').insert({ fecha: S.agendaFecha, texto, orden: maxOrden + 1 });
    if (error) { toast(error.message, true); return; }
    S.showAddObjetivo = false; toast('Objetivo agregado ✓');
    await loadAgendaDia(S.agendaFecha);
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'delete-objetivo') {
    await sb.from('agenda_objetivos').delete().eq('id', el.dataset.id);
    await loadAgendaDia(S.agendaFecha);
    document.getElementById('main-content').innerHTML = await renderAgendaDia();
  }

  else if (action === 'export-agenda-pdf') {
    const fecha = el.dataset.fecha || S.agendaFecha;
    // Indicador de carga — Render free tier puede tardar 30-50s si estaba dormido
    el.disabled = true;
    el.innerHTML = `<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px;">⏳</span> Generando PDF…`;
    const styleEl = document.createElement('style');
    styleEl.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(styleEl);
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 90000); // 90s timeout
      const res = await fetch(RENDER_URL + '/export/agenda.pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          fecha,
          fecha_larga: fechaLarga(fecha),
          objetivos: S.agendaObjetivos.map(o => o.texto),
          eventos: S.agendaEventos.map(e => ({
            hora: e.hora, hora_fin: e.hora_fin,
            compromiso: e.compromiso, lugar: e.lugar,
            responsables: e.responsables, estado: e.estado,
          })),
        }),
      });
      clearTimeout(timeoutId);
      if (!res.ok) { toast('Error generando PDF — revisa que Render esté activo', true); }
      else {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `agenda-${fecha}.pdf`; a.click();
        URL.revokeObjectURL(url);
        toast('PDF descargado ✓');
      }
    } catch(err) {
      if (err.name === 'AbortError') toast('Tiempo agotado — Render tardó más de 90s. Intenta de nuevo.', true);
      else toast('Error: ' + err.message, true);
    } finally {
      el.disabled = false;
      el.innerHTML = `${icon('download',13)} Exportar PDF`;
    }
  }

}, true);

// Enter en input objetivo
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'new-objetivo-input') {
    document.querySelector('[data-action="save-objetivo"]')?.click();
  }
});
</script>
